name: AI QA Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # 手动触发：真实大模型用例只在点按钮时跑，避免每次 push 都烧钱
  workflow_dispatch:

# allure-report-action 需要推送到 gh-pages 的权限
permissions:
  contents: write

concurrency:
  group: ai-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.17.4"

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==${RUFF_VERSION}"

      - name: 执行 ruff 检查
        run: ruff check .

  fast-tests:
    name: 快速测试（Mock）
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行快速测试（Mock）
        run: pytest -v -m "not real_api" --alluredir=./allure-results

      # 只在 push 到 main 时生成并发布报告，PR 阶段不尝试推 gh-pages
      - name: 生成 Allure 报告
        if: always() && github.event_name == 'push'
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history

      # 报告目录可能不存在（例如 PR 阶段跳过了上一步），忽略即可
      - name: 上传 Allure 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
          if-no-files-found: ignore

  real-api-tests:
    name: 真实大模型测试
    runs-on: ubuntu-latest
    # 只有手动触发时才执行；需要先在仓库 Secrets 中配置 DEEPSEEK_API_KEY
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行真实大模型测试
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pytest -v -m real_api -s --alluredir=./allure-results

      - name: 上传真实测试的 Allure 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-real-api
          path: allure-results/
          retention-days: 7
          if-no-files-found: ignore
