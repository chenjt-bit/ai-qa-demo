name: AI QA Pipeline

on:
  push:
    branchs: [ "main" ]
  pull_request:
    branchs: [ "main" ]
  # 👇 关键点 1：增加手动触发按钮！
  workflow_dispatch:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 安装python
      uses: actions/setup-python@v5
      with: 
        python-version: '3.12'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 执行快速测试（Mork）
      run: |
        pytest -v -m "not real_api" --alluredir=./allure-results

    # 👇 新增：使用官方插件生成漂亮的 Allure 报告
    - name: 生成 Allure 报告
      uses: simple-elf/allure-report-action@master
      if: always() # 即使测试失败，也要生成报告
      with:
        allure_results: allure-results
        allure_report: allure-report
        gh_pages: gh-pages
        allure_history: allure-history

    # 👇 新增：把整个报告目录打包成 zip，供你下载
    - name: 上传 Allure 报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 7


  # 任务 2：真实大模型测试（只有你手动点击时，或者定时才跑）
  real-api-tests:
    runs-on: ubuntu-latest
    # 👇 关键点 2：只有“手动触发”时才执行这个任务，避免 push 时烧钱
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 执行真实大模型攻击测试
      # 👇 关键点 3：把 GitHub Secrets 里的 Key 注入到云端的虚拟环境里
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: |
        pytest -v -m real_api -s